name: Email Automation Cron Job

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:        # allows manual trigger from Actions tab

jobs:
  run-email-job:
    runs-on: ubuntu-latest

    env:                       # 👇 add this section
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        
      - name: Debug secrets (safe test)
        run: |
            if [ -z "$EMAIL_USER" ]; then
            echo "❌ EMAIL_USER is missing"
            else
            echo "✅ EMAIL_USER is set (value hidden)"
            fi

            if [ -z "$EMAIL_PASS" ]; then
            echo "❌ EMAIL_PASS is missing"
            else
            echo "✅ EMAIL_PASS is set (value hidden)"
            fi


      - name: Run script
        run: node job.js
